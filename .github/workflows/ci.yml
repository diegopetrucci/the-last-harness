name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Non-test validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        # The root check uses TypeScript 7 while typescript-eslint@8.65.0 declares a TS <6.1 peer.
        # Remove the flag when the tooling supports TS7 and the @typescript/typescript6 shim is removed.
        run: npm ci --legacy-peer-deps

      - name: Run non-test validation checks
        env:
          HOME: ${{ runner.temp }}/tlh-home
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${HOME}"
          npm run check:package-versions
          npm run typecheck
          npm run typecheck:runtime
          npm run check:runtime
          bash scripts/check-installer-smoke.sh
          npm run lint
          npm run lint:sh
          node scripts/merge-settings.mjs --dry-run
          npm pack --dry-run

  tests:
    name: Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        shard:
          - 1
          - 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        # The root check uses TypeScript 7 while typescript-eslint@8.65.0 declares a TS <6.1 peer.
        # Remove the flag when the tooling supports TS7 and the @typescript/typescript6 shim is removed.
        run: npm ci --legacy-peer-deps

      - name: Run test shard
        env:
          HOME: ${{ runner.temp }}/tlh-home
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${HOME}"
          node --test --test-reporter=dot --test-shard=${{ matrix.shard }}/2 "tests/**/*.test.mjs"
