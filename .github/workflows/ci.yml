name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation:
    name: Non-test validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run non-test validation checks
        env:
          HOME: ${{ runner.temp }}/tlh-home
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${HOME}"
          npm run check:package-versions
          npm run check:package-contents
          npm run typecheck
          npm run typecheck:subagents-test-support
          npm run typecheck:runtime
          npm run check:runtime
          bash scripts/check-installer-smoke.sh
          npm run lint
          npm run lint:sh
          node scripts/merge-settings.mjs --dry-run
          npm pack --dry-run

  tests:
    name: Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        shard:
          - 1
          - 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test shard
        env:
          HOME: ${{ runner.temp }}/tlh-home
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${HOME}"
          node --test --test-reporter=dot --test-shard=${{ matrix.shard }}/2 "tests/**/*.test.mjs"
          node scripts/run-subagents-tests.mjs unit --test-shard=${{ matrix.shard }}/2
          node scripts/run-subagents-tests.mjs integration --test-shard=${{ matrix.shard }}/2
          if [ "${{ matrix.shard }}" = "1" ]; then
            node scripts/run-subagents-tests.mjs e2e
          fi
