name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          # The ancestry gate needs the full history to verify reachability from origin/main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Verify release commit ancestry
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-release-tag-ancestry.mjs

      - name: Verify release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be semver tags like v1.2.3." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Install test dependencies
        run: npm ci

      - name: Run release checks
        run: npm run validate

      - name: Build package tarball
        run: |
          npm pack --json > pack-output.json
          node -e "const fs = require('node:fs'); const [pkg] = JSON.parse(fs.readFileSync('pack-output.json', 'utf8')); console.log(pkg.filename);" > tarball.txt

      - name: Build pinned installer asset
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          const source = fs.readFileSync('install.sh', 'utf8');
          const replacements = [
            ['REF="${TLH_REF:-main}"', `REF="\${TLH_REF:-${tag}}"`],
            ['UPDATE_TRACK_INPUT="${TLH_UPDATE_TRACK:-}"', 'UPDATE_TRACK_INPUT="${TLH_UPDATE_TRACK:-latest-release}"'],
          ];
          let output = source;
          for (const [oldText, newText] of replacements) {
            if (!output.includes(oldText)) {
              throw new Error(`Expected installer default line not found: ${oldText}`);
            }
            output = output.replace(oldText, newText);
          }
          fs.writeFileSync('dist/install.sh', output, 'utf8');
          NODE
          chmod +x dist/install.sh
          bash -n dist/install.sh
          expected_ref_line="REF=\"\${TLH_REF:-${GITHUB_REF_NAME}}\""
          expected_track_line='UPDATE_TRACK_INPUT="${TLH_UPDATE_TRACK:-latest-release}"'
          grep -F "${expected_ref_line}" dist/install.sh
          grep -F "${expected_track_line}" dist/install.sh
          if grep -F 'REF="${TLH_REF:-main}"' dist/install.sh; then
            echo "Generated installer still defaults to main instead of ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          if grep -F 'UPDATE_TRACK_INPUT="${TLH_UPDATE_TRACK:-}"' dist/install.sh; then
            echo "Generated installer still has an empty default update track." >&2
            exit 1
          fi

      - name: Build release notes
        run: node scripts/release-notes.mjs --tag "${GITHUB_REF_NAME}" --output release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(cat tarball.txt)"
          gh release create "${GITHUB_REF_NAME}" \
            "${tarball}" \
            "dist/install.sh#install.sh" \
            "uninstall.sh#uninstall.sh" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
