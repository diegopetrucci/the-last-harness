<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLH annotate last message</title>
<style>
  /*
   * Static dark-neutral defaults. The injected theme block (see tlh-theme-vars
   * below) overrides --accent, --muted, --dim and all --md* vars with live
   * Pi theme colours. Backgrounds are kept static; Pi's public API exposes none.
   *
   * The --md* fallback values below are kept in sync with the FALLBACK
   * object in theme.ts so this template renders correctly when the injected
   * theme block is absent (e.g. opened standalone in a browser for debugging).
   */
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #151b23;
    --panel-hover: #1f242c;
    --border: #30363d;
    --text: #f0f6fc;
    --muted: #8a8a8a;
    --dim: #585858;
    --accent: #f4c95d;
    --toggle-size: 2rem;

    /* 1rem = 14px here (html font-size). */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --radius-1: 3px;
    --radius-2: 8px;
    --radius-3: 10px;
    --text-sm: 12px;
    --text-md: 13px;
    --text-lg: 14px;
    --border-line: 1px solid var(--border);
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --bar-width: 3px;
    --input-bg: #0b1118;
    --line-number-width: 32px;

    /* Markdown token colours — kept in sync with FALLBACK in theme.ts */
    --mdHeading: #f4c95d;
    --mdLink: #7dd3fc;
    --mdLinkUrl: #8a8a8a;
    --mdCode: #9b7bff;
    --mdCodeBlock: inherit;
    --mdCodeBlockBorder: #6f42c1;
    --mdQuote: #8a8a8a;
    --mdQuoteBorder: #6f42c1;
    --mdHr: #585858;
    --mdListBullet: #f4c95d;
    --mdBold: inherit;
    --mdItalic: inherit;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  button, textarea {
    font: inherit;
  }

  button {
    border: var(--border-line);
    border-radius: var(--radius-2);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }

  button:hover:not(:disabled) {
    background: var(--panel-hover);
  }

  button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  textarea {
    width: 100%;
    min-height: 5.5rem;
    padding: var(--space-2) var(--space-3);
    border: var(--border-line);
    border-radius: var(--radius-2);
    resize: vertical;
    background: var(--input-bg);
    color: var(--text);
  }

  textarea:focus {
    outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-color: var(--accent);
  }

  .page-footer {
    padding: var(--space-4) var(--space-5);
    background: rgba(13, 17, 23, 0.96);
    border-top: var(--border-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .status,
  .empty-hint,
  .line-meta,
  .section-meta {
    margin: 0;
    color: var(--muted);
  }

  .layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(340px, 0.95fr);
    overflow: hidden;
  }

  .panel {
    min-height: 0;
    border-right: var(--border-line);
    background: var(--panel);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sidebar-stack h2,
  .sidebar-stack h3 {
    margin: 0 0 var(--space-2);
    font-size: var(--text-lg);
  }

  .message-lines {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: var(--space-2) 0 var(--space-5);
  }

  .message-line {
    padding: var(--space-2) var(--space-4) 0;
    border-left: var(--bar-width) solid transparent;
  }

  .message-line-row {
    display: grid;
    grid-template-columns: var(--line-number-width) minmax(0, 1fr) var(--toggle-size);
    gap: var(--space-3);
    align-items: start;
    min-height: var(--toggle-size);
  }

  .line-number {
    color: var(--muted);
    font: var(--text-sm)/1.6 var(--font-mono);
    text-align: right;
    padding-top: var(--space-1);
  }

  .line-text {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font: var(--text-md)/1.6 var(--font-mono);
  }

  .message-line[data-has-note="true"] {
    border-left: var(--bar-width) solid color-mix(in srgb, var(--accent) 60%, transparent);
  }

  .inline-toggle {
    width: var(--toggle-size);
    height: var(--toggle-size);
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: var(--text-lg);
    line-height: 1;
    color: var(--muted);
    opacity: 0.55;
  }

  .inline-toggle svg {
    width: 14px;
    height: 14px;
    display: block;
  }

  .message-line:hover .inline-toggle,
  .inline-toggle:focus-visible,
  .inline-toggle[aria-expanded="true"] {
    opacity: 1;
    color: var(--text);
  }

  .inline-toggle[data-state="note"] {
    opacity: 1;
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .inline-editor {
    margin: var(--space-3) calc(var(--space-3) + var(--toggle-size)) 0 calc(var(--line-number-width) + var(--space-3));
  }

  .inline-editor[hidden] {
    display: none;
  }

  .inline-editor textarea {
    min-height: 4.75rem;
  }

  .sidebar-stack {
    height: 100%;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar-panel {
    border-bottom: var(--border-line);
    background: var(--panel);
    padding: var(--space-4);
  }

  .section-card {
    padding: var(--space-3);
    border: var(--border-line);
    border-radius: var(--radius-3);
    background: rgba(1, 4, 9, 0.18);
  }

  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .section-header h3 {
    margin: 0;
  }

  .section-header .section-meta {
    font-size: var(--text-sm);
    white-space: nowrap;
  }

  .section-card + .section-card {
    margin-top: var(--space-3);
  }

  .section-preview {
    margin: var(--space-2) 0 var(--space-3);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-2);
    background: var(--input-bg);
    font: var(--text-sm)/1.5 var(--font-mono);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty-hint {
    padding: var(--space-3) 0 0;
  }

  .footer-actions {
    display: flex;
    gap: var(--space-2);
  }

  .footer-actions button {
    padding: var(--space-2) var(--space-4);
  }

  .kbd-hint {
    margin-left: var(--space-2);
    padding: 0 var(--space-1);
    border: var(--border-line);
    border-radius: var(--radius-1);
    color: var(--muted);
    font: var(--text-sm)/1.4 var(--font-mono);
  }

  .section-preview-more {
    color: var(--muted);
    font-style: italic;
  }

  .submit-button {
    border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    background: color-mix(in srgb, var(--accent) 20%, var(--panel));
  }

  .submit-button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--accent) 32%, var(--panel));
  }

  .cancel-button:hover:not(:disabled) {
    border-color: color-mix(in srgb, var(--muted) 45%, transparent);
  }

  /*
   * Status colours are static hex values. Pi's public API exposes no
   * success/error colour tokens — getMarkdownTheme() covers markdown tokens
   * only, and the list themes give accent/muted/dim only. If Pi ever exposes
   * these, they could be wired through getThemeCssVars() in theme.ts.
   */
  .status[data-state="error"] {
    color: #ffb3b3;
  }

  .status[data-state="ready"] {
    color: #7ee787;
  }

  /* -------------------------------------------------------------------------
   * Markdown token classes — consumed by the renderer.
   * Mirrors upstream Pi's .markdown-content rules from
   * dist/core/export-html/template.css, adapted for the 13px/1.6 monospace
   * annotate-window context.
   * --mdBold / --mdItalic are colour vars (typically "inherit"); actual bold /
   * italic rendering uses font-weight / font-style.
   * ------------------------------------------------------------------------- */

  .markdown-content {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .markdown-content h1,
  .markdown-content h2,
  .markdown-content h3,
  .markdown-content h4,
  .markdown-content h5,
  .markdown-content h6 {
    color: var(--mdHeading);
    font-weight: bold;
    margin: 0;
  }

  .markdown-content p { margin: 0; }
  .markdown-content p + p { margin-top: var(--space-1); }

  .markdown-content a {
    color: var(--mdLink);
    text-decoration: underline;
  }

  /* Link URL shown beside or below the link text */
  .markdown-content .md-link-url {
    color: var(--mdLinkUrl);
    font-size: 0.9em;
    text-decoration: none;
  }

  .markdown-content code {
    background: rgba(128, 128, 128, 0.2);
    color: var(--mdCode);
    padding: 0 var(--space-1);
    border-radius: var(--radius-1);
    font-family: inherit;
  }

  .markdown-content pre {
    background: transparent;
    margin: var(--space-1) 0;
    overflow-x: auto;
    border-left: var(--bar-width) solid var(--mdCodeBlockBorder);
    padding-left: var(--space-2);
  }

  .markdown-content pre code {
    display: block;
    background: none;
    color: var(--mdCodeBlock, var(--text));
    padding: 0;
  }

  .markdown-content blockquote {
    border-left: var(--bar-width) solid var(--mdQuoteBorder);
    padding-left: var(--space-2);
    margin: var(--space-1) 0;
    color: var(--mdQuote);
    font-style: italic;
  }

  .markdown-content ul,
  .markdown-content ol {
    margin: var(--space-1) 0;
    padding-left: 1.5em;
  }

  .markdown-content li { margin: 0; }
  .markdown-content li::marker { color: var(--mdListBullet); }

  .markdown-content hr {
    border: none;
    border-top: 1px solid var(--mdHr);
    margin: var(--space-1) 0;
  }

  /* Bold / italic: font-weight/font-style carry the visual emphasis;
   * --mdBold / --mdItalic are colour vars (inherit for Pi's ANSI theme). */
  .markdown-content strong {
    font-weight: bold;
    color: var(--mdBold);
  }

  .markdown-content em {
    font-style: italic;
    color: var(--mdItalic);
  }

  @media (max-width: 1100px) {
    .layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }

    .panel {
      border-right: none;
      border-bottom: var(--border-line);
    }

    .panel,
    .sidebar-stack {
      min-height: 520px;
    }
  }
</style>
<!-- Live Pi theme vars — injected by ui.ts, overrides the static :root defaults above -->
<style id="tlh-theme-vars">__INLINE_THEME__</style>
</head>
<body>
<div class="layout">
  <section class="panel">
    <div id="message-lines" class="message-lines"></div>
  </section>

  <aside class="sidebar-stack">
    <section class="sidebar-panel">
      <h2>Overall guidance</h2>
      <textarea id="overall-comment" autocorrect="off" autocapitalize="off" placeholder="Overall direction for the next response…"></textarea>
    </section>

    <section class="sidebar-panel">
      <h2>Section comments</h2>
      <div id="section-comments"></div>
    </section>
  </aside>
</div>

<footer class="page-footer">
  <p id="status" class="status">Add any feedback you want to send to the agent.</p>
  <div class="footer-actions">
    <button id="cancel-button" class="cancel-button" type="button">Cancel <kbd class="kbd-hint">Esc</kbd></button>
    <button id="submit-button" class="submit-button" type="button">Submit feedback <kbd id="submit-hint" class="kbd-hint">⌘ ↵</kbd></button>
  </div>
</footer>

<script id="annotate-last-message-data" type="application/json">"__INLINE_DATA__"</script>
<script>
__INLINE_MD_RENDERER_JS__
</script>
<script>
__INLINE_JS__
</script>
</body>
</html>
